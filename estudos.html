<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos Bíblicos | YAHWEH</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/Logo.png">
    
    <style>
        :root {
            --bg-dark: #0B0B0B;
            --card-bg: #131313;
            --card-bg-hover: #1A1A1A;
            --gold: #C8A96B;
            --gold-hover: #B39256;
            --white-biblical: #E5E5E5;
            --gray-text: #888888;
        }

        body { background-color: var(--bg-dark); color: var(--white-biblical); font-family: 'Playfair Display', serif; overflow-x: hidden; }
        h1, h2, h3, .nav-link, .section-title { font-family: 'Cinzel', serif; letter-spacing: 2px; }

        .navbar { background-color: var(--bg-dark); border-bottom: 1px solid rgba(200, 169, 107, 0.15); padding: 1.5rem 0; }
        .logo-img { height: 75px; width: auto; display: inline-block; }

        .nav-link { color: var(--white-biblical) !important; font-size: 1.1rem; font-weight: 700; margin-left: 30px; }

        .page-header { padding: 150px 0 80px 0; text-align: center; }
        .page-title { font-size: 3.5rem; color: var(--gold); }

        .card-custom {
            background: linear-gradient(145deg, var(--card-bg), #0f0f0f);
            border: 1px solid rgba(200, 169, 107, 0.12);
            padding: 40px;
            text-align: center;
        }

        .card-title { color: var(--gold); }

        .btn-yahweh-outline {
            border: 1px solid var(--gold);
            color: var(--gold) !important;
            padding: 12px 30px;
            background: transparent;
        }

        footer {
            padding: 80px 0 40px 0;
            border-top: 1px solid rgba(200, 169, 107, 0.2);
            background-color: #080808;
        }

        .footer-brand { color: var(--gold); }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <img src="img/Logo.png" class="logo-img">
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Índice</a>
            <a class="nav-link" href="biblia.html">Bíblia Sagrada</a>
            <a class="nav-link" href="ia.html">Dúvidas e respostas</a>
            <a class="nav-link" href="estudos.html">Estudos bíblicos</a>
        </div>
    </div>
</nav>

<section class="page-header">
    <h1 class="page-title">Estudos Bíblicos</h1>
</section>

<div class="container pb-5">
    <div class="row g-4" id="container-estudos"></div>
</div>

<div class="container mb-5">
    <div id="area-explicacao" class="p-5" style="border:1px solid var(--gold); display:none; background:#0f0f0f;">
        <h2 id="titulo-alvo" style="color:var(--gold)"></h2>
        <div id="texto-alvo" style="color:#E5E5E5"></div>

        <div class="text-center mt-4">
            <button class="btn btn-yahweh-outline" onclick="fecharEstudo()">Fechar Estudo</button>
        </div>
    </div>
</div>

<footer>
    <div class="container text-center">
        <div class="footer-brand">YAHWEH</div>
    </div>
</footer>

<script>
let dadosGlobais = [];

async function carregarEstudos() {
    const resposta = await fetch('./estudos.json?v=' + Date.now());
    const data = await resposta.json();
    dadosGlobais = data.estudos;

    const container = document.getElementById('container-estudos');
    container.innerHTML = "";

    data.estudos.forEach(item => {
        const tituloSeguro = item.titulo.replace(/'/g, "\\'");

        container.innerHTML += `
        <div class="col-md-4">
            <div class="card-custom">
                <h3 class="card-title">${item.titulo}</h3>
                <button class="btn btn-yahweh-outline"
                    onclick="abrirEstudo('${tituloSeguro}')">
                    Acessar
                </button>
            </div>
        </div>`;
    });
}

function abrirEstudo(titulo) {

    const item = dadosGlobais.find(i => i.titulo === titulo);
    if (!item) return;

    document.getElementById('titulo-alvo').innerText = item.titulo;
    document.getElementById('texto-alvo').innerText =
        item.base_teologica + "\n\n" +
        item.explicacao_espiritual + "\n\n" +
        item.apelo_evangelistico;

    const area = document.getElementById('area-explicacao');
    area.style.display = 'block';

    /* ✅ CORREÇÃO REAL (sem scroll bug) */
    setTimeout(() => {
        window.scrollTo({
            top: area.offsetTop - 80,
            behavior: "smooth"
        });
    }, 50);
}

function fecharEstudo() {
    document.getElementById('area-explicacao').style.display = 'none';

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

window.abrirEstudo = abrirEstudo;
window.fecharEstudo = fecharEstudo;

document.addEventListener("DOMContentLoaded", carregarEstudos);
</script>

</body>
</html>
